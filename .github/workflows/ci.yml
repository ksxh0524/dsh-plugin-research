name: CI
"on":
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      # aivideo-core 用仓外 link:../aivideo-core（工作区顶层转发壳）——CI 单仓 checkout 时该 link 缺失，
      # 类型解析靠 package.json dependencies 声明 + 发布物；本地工作区开发直接 pnpm check。
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
